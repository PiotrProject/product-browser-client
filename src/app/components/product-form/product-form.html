<section class="card">

  <h2>Dodaj produkt</h2>

  <form
    #productForm="ngForm"
    (ngSubmit)="addProduct()"
  >

    <div class="form-group">

      <label for="kod">
        Kod
      </label>

      <input
        id="kod"
        name="kod"
        type="text"
        [(ngModel)]="newProduct.kod"
        [disabled]="isAddingProduct"
        required
      >

    </div>

    <div class="form-group">

      <label for="nazwa">
        Nazwa
      </label>

      <input
        id="nazwa"
        name="nazwa"
        type="text"
        [(ngModel)]="newProduct.nazwa"
        [disabled]="isAddingProduct"
        required
      >

    </div>

    <div class="form-group">

      <label for="cena">
        Cena
      </label>

      <input
        id="cena"
        name="cena"
        type="number"
        min="0.01"
        step="0.01"
        [(ngModel)]="newProduct.cena"
        [disabled]="isAddingProduct"
        required
      >

    </div>

    <button
      type="submit"
      [disabled]="
        productForm.invalid ||
        isAddingProduct
      "
    >

      <span
        *ngIf="isAddingProduct"
        class="spinner spinner-small"
      ></span>

      {{
        isAddingProduct
          ? 'Dodawanie...'
          : 'Dodaj produkt'
      }}

    </button>

  </form>

  <p
    *ngIf="message"
    class="message"
  >
    {{ message }}
  </p>

</section>
