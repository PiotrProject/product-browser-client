<main class="container">

  <h1>Katalog produktów</h1>

  <section class="card">

    <h2>Dodaj produkt</h2>

    <form
      #productForm="ngForm"
      (ngSubmit)="addProduct()"
    >

      <div class="form-group">

        <label for="kod">
          Kod
        </label>

        <input
          id="kod"
          name="kod"
          type="text"
          [(ngModel)]="newProduct.kod"
          [disabled]="isAddingProduct"
          required
        >

      </div>

      <div class="form-group">

        <label for="nazwa">
          Nazwa
        </label>

        <input
          id="nazwa"
          name="nazwa"
          type="text"
          [(ngModel)]="newProduct.nazwa"
          [disabled]="isAddingProduct"
          required
        >

      </div>

      <div class="form-group">

        <label for="cena">
          Cena
        </label>

        <input
          id="cena"
          name="cena"
          type="number"
          min="0.01"
          step="0.01"
          [(ngModel)]="newProduct.cena"
          [disabled]="isAddingProduct"
          required
        >

      </div>

      <button
        type="submit"
        [disabled]="
          productForm.invalid ||
          isAddingProduct
        "
      >

        <span
          *ngIf="isAddingProduct"
          class="spinner spinner-small"
        ></span>

        {{
          isAddingProduct
            ? 'Dodawanie...'
            : 'Dodaj produkt'
        }}

      </button>

    </form>

    <p
      *ngIf="message"
      class="message"
    >
      {{ message }}
    </p>

  </section>


  <section class="card">

    <h2>Lista produktów</h2>


    <!-- LOADER LISTY -->

    <div
      *ngIf="isLoadingProducts"
      class="loading"
    >

      <span class="spinner"></span>

      <span>
        Ładowanie produktów...
      </span>

    </div>


    <!-- TABELA -->

    <table *ngIf="!isLoadingProducts">

      <thead>

        <tr>
          <th>Id</th>
          <th>Kod</th>
          <th>Nazwa</th>
          <th>Cena</th>
        </tr>

      </thead>

      <tbody>

        <tr
          *ngFor="let product of products"
        >

          <td>
            {{ product.id }}
          </td>

          <td>
            {{ product.kod }}
          </td>

          <td>
            {{ product.nazwa }}
          </td>

          <td>
            {{
              product.cena
                | number:'1.2-2'
            }}
            zł
          </td>

        </tr>


        <tr *ngIf="products.length === 0">

          <td
            colspan="4"
            class="empty"
          >
            Brak produktów.
          </td>

        </tr>

      </tbody>

    </table>

  </section>

</main>
